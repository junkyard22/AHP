name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Remove deprecated npm auth config
        shell: bash
        run: |
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/^always-auth=/d' "$NPM_CONFIG_USERCONFIG"
          fi
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Check npm version
        id: package
        shell: bash
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/tmp/npm-view.err 2>&1; then
            echo "::notice::$name@$version is already published; skipping npm publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif grep -q "E404" /tmp/npm-view.err; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/npm-view.err >&2
            exit 1
          fi
      - run: npm publish
        if: steps.package.outputs.publish == 'true'
